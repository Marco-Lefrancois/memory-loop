[project]
name = "memory-loop"
version = "0.1.0"
description = "Cognitive pure state-graph multi-agent CLI framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "networkx>=3.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "inquirer>=3.1.3",
    "playwright>=1.40.0",
    "markdownify>=0.11.0",
    "pyyaml>=6.0.0",
    "openai>=1.14.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.0.0",
    "markitdown>=0.0.1a4",
    "pypdf>=3.0.0",
    "openpyxl>=3.0.0",
    "python-docx>=1.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
loop = "src.swarm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = [
    "default::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
